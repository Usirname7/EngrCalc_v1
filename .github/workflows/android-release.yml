name: EngrCalc_v1 Android release

on:
  push:
    branches: [main]
    paths:
      - 'extracted/EngrCalc_v1/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify extracted project
        run: test -f extracted/EngrCalc_v1/pubspec.yaml
      - name: Generate Android platform files
        working-directory: extracted/EngrCalc_v1
        run: |
          rm -rf android
          flutter create --platforms=android --org com.engrcalc --project-name engr_calc_v1 .
          sed -i 's/android:label="engr_calc_v1"/android:label="EngrCalc_v1"/' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
      - name: Resolve dependencies
        working-directory: extracted/EngrCalc_v1
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: extracted/EngrCalc_v1
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run formula tests
        working-directory: extracted/EngrCalc_v1
        run: flutter test
      - name: Build standalone release APK
        working-directory: extracted/EngrCalc_v1
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngrCalc_v1-release-apk
          path: extracted/EngrCalc_v1/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: extracted/EngrCalc_v1/build/app/outputs/flutter-apk/app-release.apk
          TAG: v0.1.${{ github.run_number }}
        run: |
          gh release create "$TAG" "$APK_PATH" \
            --title "EngrCalc_v1 $TAG" \
            --notes "Android APK built by GitHub Actions after Dart analysis and formula tests passed."
